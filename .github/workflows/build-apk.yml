name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute Auto Version (1.0..1.9 -> 2.0..2.9 -> ...)
        id: ver
        run: |
          RUN_NUM=${{ github.run_number }}
          MAJOR=$(( 1 + (RUN_NUM - 1) / 10 ))
          MINOR=$(( (RUN_NUM - 1) % 10 ))
          VERSION_NAME="${MAJOR}.${MINOR}"
          echo "version_code=${RUN_NUM}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Auto version: v${VERSION_NAME} (code ${RUN_NUM})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: >
          gradle assembleDebug --stacktrace
          -PappVersionCode=${{ steps.ver.outputs.version_code }}
          -PappVersionName=${{ steps.ver.outputs.version_name }}

      - name: Rename APK with auto version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Tri.Le.docx.pdf-v${{ steps.ver.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tri.Le.docx.pdf-v${{ steps.ver.outputs.version_name }}
          path: dist/Tri.Le.docx.pdf-v${{ steps.ver.outputs.version_name }}.apk
          retention-days: 30
